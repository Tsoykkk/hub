<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Hub</title>
  <style>
    :root {
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.7);
      --accent: #fff;
      
      /* Эффект матового стекла */
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-blur: blur(15px);
      
      /* Кнопки скачивания софта */
      --download-bg: rgba(0, 255, 179, 0.15);
      --download-text: #00ffb3;
      --download-hover: rgba(0, 255, 179, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      background-color: #0d1117;
      background-image: url('https://images.unsplash.com/photo-1599672124560-ebf1d7d020d5?q=80&w=2560&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text); 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
      padding: 60px 20px;
    }

    .container { width: 100%; max-width: 1060px; }

    /* Поисковая строка */
    .search-box { margin-bottom: 45px; }
    .search-form { display: flex; width: 100%; justify-content: center; }
    .search-input {
      width: 100%; max-width: 600px; padding: 16px 22px; font-size: 16px; 
      border-radius: 50px;
      border: 1px solid var(--glass-border); 
      background: var(--glass-bg); 
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      color: var(--text); outline: none; transition: 0.3s;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .search-input:focus { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
    .search-input::placeholder { color: var(--text-dim); }

    /* Сетка */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    
    /* Карточка (Glassmorphism) */
    .card { 
      background: var(--glass-bg); 
      backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border); 
      border-radius: 20px; 
      padding: 25px; 
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }

    .card-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 18px; text-align: center; }

    /* Список ссылок */
    .link-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    
    .link-item a {
      display: flex; align-items: center; justify-content: space-between; text-decoration: none;
      color: var(--text); padding: 12px 16px; border-radius: 10px; 
      background: rgba(255, 255, 255, 0.03); 
      transition: 0.2s; font-size: 15px; border: 1px solid transparent;
    }
    .link-item a:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255,255,255,0.1); color: #fff; transform: translateX(3px); }

    /* Софт */
    .download-link a {
      background: var(--download-bg); border-color: transparent; color: var(--download-text); font-weight: 600;
    }
    .download-link a:hover { background: var(--download-hover); border-color: var(--download-text); color: #fff; transform: none; }
    .badge { font-size: 11px; padding: 3px 7px; border-radius: 6px; background: rgba(0,0,0,0.3); color: var(--text-dim); }
    .download-link a:hover .badge { background: #fff; color: #000; }
  </style>
</head>
<body>

<div class="container">
  <!-- Поиск -->
  <div class="search-box">
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input class="search-input" type="text" name="q" placeholder="Поиск в Интернете..." autofocus autocomplete="off">
    </form>
  </div>

  <div class="grid">
    <!-- Блок: Главное -->
    <div class="card">
      <div class="card-title">Главное</div>
      <ul class="link-list">
        <li class="link-item"><a href="https://youtube.com" target="_blank">YouTube</a></li>
        <li class="link-item"><a href="https://vk.com" target="_blank">VK</a></li>
        <li class="link-item"><a href="https://web.telegram.org" target="_blank">Telegram Web</a></li>
        <li class="link-item"><a href="https://mail.google.com" target="_blank">Gmail</a></li>
      </ul>
    </div>

    <!-- Блок: Инструменты -->
    <div class="card">
      <div class="card-title">Инструменты</div>
      <ul class="link-list">
        <li class="link-item"><a href="https://github.com/Tsoykkk" target="_blank">Мой GitHub</a></li>
        <li class="link-item"><a href="https://drive.google.com" target="_blank">Google Drive</a></li>
      </ul>
    </div>

    <!-- Блок: Установка / Софт -->
    <div class="card">
      <div class="card-title">Установка / Софт</div>
      <ul class="link-list">
        <!-- Рабочий клиент с Google Диска -->
        <li class="link-item download-link">
          <a href="https://drive.google.com/uc?export=download&id=1R4qS6nf7E6yvOklN5qPHYmJEugviinTW" target="_blank">
            Рабочий клиент <span class="badge">.rar</span>
          </a>
        </li>

        <!-- Telegram Desktop с вашего Google Диска -->
        <li class="link-item download-link">
          <a href="https://drive.google.com/uc?export=download&id=1NZCrzRdn3aOfpjHfYUbQN7s8FYKEZDlV" target="_blank">
            Telegram Desktop <span class="badge">.exe</span>
          </a>
        </li>

        <!-- 7-Zip -->
        <li class="link-item download-link">
          <a href="https://www.7-zip.org/a/7z2408-x64.exe" target="_blank">
            7-Zip Installer <span class="badge">.exe</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>

</body>
</html>
