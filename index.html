<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpage</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #181b24;
      --card-border: #282c39;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --download-btn: #10b981;
      --download-btn-hover: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 40px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 960px; }

    /* Поисковая строка */
    .search-box { margin-bottom: 35px; }
    .search-form { display: flex; width: 100%; }
    .search-input {
      width: 100%; padding: 14px 18px; font-size: 16px; border-radius: 12px;
      border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text); outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }

    /* Сетка блоков */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; }
    .card-title { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 14px; }

    /* Обычные ссылки */
    .link-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .link-item a {
      display: flex; align-items: center; justify-content: space-between; text-decoration: none;
      color: var(--text); padding: 10px 12px; border-radius: 8px; background: rgba(255, 255, 255, 0.02); transition: 0.15s; font-size: 14.5px;
    }
    .link-item a:hover { background: rgba(255, 255, 255, 0.06); color: var(--accent-hover); transform: translateX(3px); }

    /* Кнопки скачивания софта */
    .download-link a {
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); color: #34d399; font-weight: 500;
    }
    .download-link a:hover { background: var(--download-btn); color: #fff; transform: none; }
    .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); color: var(--text-dim); }
    .download-link a:hover .badge { background: rgba(0, 0, 0, 0.2); color: #fff; }
  </style>
</head>
<body>

<div class="container">
  <!-- Строка поиска Google -->
  <div class="search-box">
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input class="search-input" type="text" name="q" placeholder="Поиск в Google..." autofocus autocomplete="off">
    </form>
  </div>

  <div class="grid">
    <!-- Секция: Повседневное -->
    <div class="card">
      <div class="card-title">Частое</div>
      <ul class="link-list">
        <li class="link-item"><a href="https://youtube.com" target="_blank">YouTube</a></li>
        <li class="link-item"><a href="https://vk.com" target="_blank">VK</a></li>
        <li class="link-item"><a href="https://web.telegram.org" target="_blank">Telegram Web</a></li>
        <li class="link-item"><a href="https://mail.google.com" target="_blank">Gmail</a></li>
      </ul>
    </div>

    <!-- Секция: Сервисы и инструменты -->
    <div class="card">
      <div class="card-title">Сервисы</div>
      <ul class="link-list">
        <li class="link-item"><a href="https://github.com" target="_blank">GitHub</a></li>
        <li class="link-item"><a href="https://disk.yandex.ru" target="_blank">Яндекс Диск</a></li>
        <li class="link-item"><a href="https://speedtest.net" target="_blank">Speedtest</a></li>
      </ul>
    </div>

    <!-- Секция: Быстрый софт после сноса винды -->
    <div class="card">
      <div class="card-title">Установка / Софт</div>
      <ul class="link-list">
        <!-- В href вставляйте прямые ссылки на .exe или на облако -->
        <li class="link-item download-link">
          <a href="https://telegram.org/dl/desktop/win64" target="_blank">Telegram Desktop <span class="badge">.exe</span></a>
        </li>
        <li class="link-item download-link">
          <a href="https://www.7-zip.org/a/7z2408-x64.exe" target="_blank">7-Zip <span class="badge">.exe</span></a>
        </li>
        <li class="link-item download-link">
          <a href="https://ninite.com" target="_blank">Ninite (Пакетный софт) <span class="badge">web</span></a>
        </li>
        <li class="link-item download-link">
          <a href="https://disk.yandex.ru/ВАША_ПАПКА" target="_blank">Мой пак конфигов и утилит <span class="badge">Cloud</span></a>
        </li>
      </ul>
    </div>
  </div>
</div>

</body>
</html>
